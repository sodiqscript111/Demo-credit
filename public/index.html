<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DemoCredit — Wallet Tester</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --surface2:   #21263a;
      --border:     #2e3450;
      --accent:     #4f6ef7;
      --accent-h:   #6b86ff;
      --green:      #22c55e;
      --red:        #ef4444;
      --amber:      #f59e0b;
      --text:       #e2e8f0;
      --muted:      #8892aa;
      --radius:     10px;
      --font:       'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Layout ───────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -.3px; }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 4px 12px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .status-dot.ok  { background: var(--green); }
    .status-dot.err { background: var(--red); }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    /* ── Cards ────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ── Tabs ─────────────────────────────────────────────────── */
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
    .tab {
      padding: 8px 20px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Forms ────────────────────────────────────────────────── */
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    input, select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      padding: 9px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }

    /* ── Buttons ──────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 7px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-full { width: 100%; }

    /* ── Alerts ───────────────────────────────────────────────── */
    .alert {
      border-radius: 7px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 14px;
      display: none;
    }
    .alert.show { display: block; }
    .alert-success { background: #0f2a1a; border: 1px solid #22c55e44; color: var(--green); }
    .alert-error   { background: #2a0f0f; border: 1px solid #ef444444; color: var(--red); }
    .alert-info    { background: #0f1a2a; border: 1px solid #4f6ef744; color: var(--accent-h); }

    /* ── Wallet card ──────────────────────────────────────────── */
    .wallet-hero {
      background: linear-gradient(135deg, #1e2a5a 0%, #1a1d27 100%);
      border: 1px solid #2e3a6e;
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .wallet-hero::after {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 160px; height: 160px;
      background: radial-gradient(circle, #4f6ef722 0%, transparent 70%);
      pointer-events: none;
    }
    .wallet-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
    .wallet-balance { font-size: 38px; font-weight: 700; margin: 6px 0; letter-spacing: -1px; }
    .wallet-id { font-size: 11px; color: var(--muted); font-family: monospace; }
    .wallet-meta { display: flex; gap: 20px; margin-top: 16px; }
    .wallet-meta-item { font-size: 12px; color: var(--muted); }
    .wallet-meta-item span { display: block; color: var(--text); font-weight: 600; }

    /* ── Grid ─────────────────────────────────────────────────── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ── Table ────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-credit { background: #0f2a1a; color: var(--green); }
    .badge-debit  { background: #2a0f0f; color: var(--red); }
    .mono { font-family: monospace; font-size: 12px; color: var(--muted); }
    .empty { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; }

    /* ── Log panel ────────────────────────────────────────────── */
    #log {
      font-family: monospace;
      font-size: 12px;
      background: #08090e;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      max-height: 280px;
      overflow-y: auto;
      color: #8892aa;
    }
    .log-entry { margin-bottom: 10px; }
    .log-req  { color: var(--accent-h); }
    .log-res  { color: var(--green); }
    .log-err  { color: var(--red); }
    .log-time { color: #555; font-size: 11px; }

    /* ── Session bar ──────────────────────────────────────────── */
    #session-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 20px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    #session-bar.show { display: flex; }
    .session-info { font-size: 12px; color: var(--muted); }
    .session-info strong { color: var(--text); }

    /* ── Misc ─────────────────────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .divider { height: 1px; background: var(--border); margin: 20px 0; }
    .text-muted { color: var(--muted); font-size: 12px; }
    .mt-2 { margin-top: 8px; }
    .flex-end { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────── -->
<header>
  <span class="logo">⚡ DemoCredit</span>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="status-pill">
      <div class="status-dot" id="health-dot"></div>
      <span id="health-text">checking…</span>
    </div>
    <input id="base-url" value="http://localhost:3000"
      style="width:220px;padding:6px 10px;font-size:12px;border-radius:6px"
      placeholder="http://localhost:3000" />
  </div>
</header>

<main>

  <!-- ── Session bar ──────────────────────────────────────────────────── -->
  <div id="session-bar">
    <div class="session-info">
      Signed in as <strong id="session-email">—</strong>
      &nbsp;·&nbsp; Wallet <span class="mono" id="session-wallet">—</span>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="signOut()">Sign out</button>
  </div>

  <!-- ── Auth ─────────────────────────────────────────────────────────── -->
  <div id="auth-section">
    <div class="card">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login -->
      <div id="tab-login" class="tab-panel active">
        <div class="field"><label>Email</label><input id="login-email" type="email" placeholder="you@example.com" /></div>
        <div class="field"><label>Password</label><input id="login-password" type="password" placeholder="••••••••" /></div>
        <button class="btn btn-primary btn-full" onclick="login()">Login</button>
        <div id="login-alert" class="alert"></div>
      </div>

      <!-- Register -->
      <div id="tab-register" class="tab-panel">
        <div class="field"><label>Email</label><input id="reg-email" type="email" placeholder="you@example.com" /></div>
        <div class="field"><label>Password</label><input id="reg-password" type="password" placeholder="min 6 characters" /></div>
        <button class="btn btn-primary btn-full" onclick="register()">Create Account</button>
        <div id="reg-alert" class="alert"></div>
      </div>
    </div>
  </div>

  <!-- ── Dashboard ─────────────────────────────────────────────────────── -->
  <div id="dashboard" style="display:none">

    <!-- Wallet hero -->
    <div class="wallet-hero">
      <div class="wallet-label">Available Balance</div>
      <div class="wallet-balance" id="wallet-balance">₦ —</div>
      <div class="wallet-id" id="wallet-id-display">wallet id: —</div>
      <div class="wallet-meta">
        <div class="wallet-meta-item">Currency <span id="wallet-currency">—</span></div>
        <div class="wallet-meta-item">Wallet ID <span><button class="btn btn-ghost btn-sm" onclick="copyWalletId()" style="font-size:11px;padding:2px 8px">Copy ID</button></span></div>
      </div>
    </div>

    <div class="grid-2">

      <!-- Transfer -->
      <div class="card">
        <div class="card-title">Send Money</div>
        <div class="field">
          <label>Recipient Wallet ID</label>
          <input id="tx-to" placeholder="paste wallet UUID" />
        </div>
        <div class="field">
          <label>Amount (₦)</label>
          <input id="tx-amount" type="number" step="0.01" min="0.01" placeholder="0.00" />
        </div>
        <div class="flex-end mt-2">
          <button class="btn btn-ghost btn-sm" onclick="generateIdempotencyKey()">↺ New Key</button>
          <button class="btn btn-primary" onclick="transfer()">Send Transfer</button>
        </div>
        <div class="field mt-2">
          <label>Idempotency Key <span class="text-muted">(auto-generated)</span></label>
          <input id="tx-idem" readonly style="font-family:monospace;font-size:11px;color:var(--muted)" />
        </div>
        <div id="tx-alert" class="alert"></div>
      </div>

      <!-- Wallet lookup -->
      <div class="card">
        <div class="card-title">Look Up Wallet</div>
        <div class="field">
          <label>Wallet ID</label>
          <input id="lookup-id" placeholder="paste any wallet UUID" />
        </div>
        <button class="btn btn-ghost btn-full" onclick="lookupWallet()">Look Up</button>
        <div id="lookup-result" class="mt-2" style="display:none">
          <div class="divider"></div>
          <div class="field"><label>Wallet ID</label><div class="mono" id="lookup-wid"></div></div>
          <div class="field"><label>Balance</label><div style="font-weight:700" id="lookup-bal"></div></div>
          <div class="field"><label>Currency</label><div id="lookup-cur"></div></div>
        </div>
        <div id="lookup-alert" class="alert"></div>

        <div class="divider"></div>
        <div class="card-title">My Wallet</div>
        <button class="btn btn-ghost btn-full" onclick="refreshWallet()">↺ Refresh Balance</button>
      </div>

    </div>

    <!-- Ledger -->
    <div class="card">
      <div class="section-header">
        <div class="card-title" style="margin:0">Transaction History</div>
        <div style="display:flex;gap:8px;align-items:center">
          <select id="ledger-limit" style="width:auto;padding:5px 8px;font-size:12px">
            <option value="10">10 rows</option>
            <option value="20">20 rows</option>
            <option value="50">50 rows</option>
          </select>
          <button class="btn btn-ghost btn-sm" onclick="loadLedger()">↺ Refresh</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Type</th>
              <th>Amount</th>
              <th>Reference</th>
              <th>Transfer ID</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="ledger-body">
            <tr><td colspan="5" class="empty">No transactions yet</td></tr>
          </tbody>
        </table>
      </div>
      <div id="ledger-alert" class="alert"></div>
    </div>

    <!-- API Log -->
    <div class="card">
      <div class="section-header">
        <div class="card-title" style="margin:0">API Log</div>
        <button class="btn btn-ghost btn-sm" onclick="clearLog()">Clear</button>
      </div>
      <div id="log"><span style="color:#555">Waiting for requests…</span></div>
    </div>

  </div><!-- /dashboard -->
</main>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
const state = {
  token:    localStorage.getItem('dc_token'),
  email:    localStorage.getItem('dc_email'),
  walletId: localStorage.getItem('dc_walletId'),
};

const base = () => document.getElementById('base-url').value.replace(/\/$/, '');

// ── Boot ──────────────────────────────────────────────────────────────────────
window.onload = async () => {
  checkHealth();
  generateIdempotencyKey();
  setInterval(checkHealth, 15_000);
  if (state.token) restoreSession();
};

// ── Health ────────────────────────────────────────────────────────────────────
async function checkHealth() {
  const dot  = document.getElementById('health-dot');
  const text = document.getElementById('health-text');
  try {
    const r = await fetch(`${base()}/health/ready`);
    const j = await r.json();
    const ok = j.status === 'ok';
    dot.className  = `status-dot ${ok ? 'ok' : 'err'}`;
    text.textContent = ok ? 'API online' : 'DB degraded';
  } catch {
    dot.className  = 'status-dot err';
    text.textContent = 'API offline';
  }
}

// ── API helper ────────────────────────────────────────────────────────────────
async function api(method, path, body, extraHeaders = {}) {
  const url  = `${base()}${path}`;
  const headers = { 'Content-Type': 'application/json', ...extraHeaders };
  if (state.token) headers['Authorization'] = `Bearer ${state.token}`;

  logReq(method, url, body);

  const res = await fetch(url, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });

  const json = await res.json().catch(() => ({}));
  logRes(res.status, json);

  if (!res.ok) {
    const msg = json.message || json.error || `HTTP ${res.status}`;
    throw new Error(msg);
  }
  return json;
}

// ── Auth ──────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
  });
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
}

async function login() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  clearAlert('login-alert');
  try {
    const j = await api('POST', '/api/v1/auth/login', { email, password });
    state.token = j.data.accessToken;
    state.email = j.data.user.email;
    localStorage.setItem('dc_token', state.token);
    localStorage.setItem('dc_email', state.email);
    await fetchMyWallet();
    showDashboard();
    showAlert('login-alert', 'success', `Welcome back, ${state.email}!`);
  } catch (e) {
    showAlert('login-alert', 'error', e.message);
  }
}

async function register() {
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  clearAlert('reg-alert');
  try {
    const j = await api('POST', '/api/v1/auth/register', { email, password });
    state.token    = j.data.accessToken;
    state.email    = j.data.user.email;
    state.walletId = j.data.wallet.id;
    localStorage.setItem('dc_token',    state.token);
    localStorage.setItem('dc_email',    state.email);
    localStorage.setItem('dc_walletId', state.walletId);
    showDashboard();
    updateWalletUI(j.data.wallet);
    showAlert('reg-alert', 'success', `Account created! Wallet provisioned: ${state.walletId}`);
  } catch (e) {
    showAlert('reg-alert', 'error', e.message);
  }
}

function signOut() {
  ['dc_token','dc_email','dc_walletId'].forEach(k => localStorage.removeItem(k));
  Object.assign(state, { token: null, email: null, walletId: null });
  document.getElementById('auth-section').style.display = 'block';
  document.getElementById('dashboard').style.display     = 'none';
  document.getElementById('session-bar').classList.remove('show');
}

function restoreSession() {
  showDashboard();
  fetchMyWallet().catch(() => {});
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function showDashboard() {
  document.getElementById('auth-section').style.display = 'none';
  document.getElementById('dashboard').style.display     = 'block';
  document.getElementById('session-bar').classList.add('show');
  document.getElementById('session-email').textContent  = state.email || '—';
  document.getElementById('session-wallet').textContent = state.walletId ? abbrev(state.walletId) : '—';
  loadLedger();
}

async function fetchMyWallet() {
  const j = await api('GET', '/api/v1/wallets/me');
  const w = j.data;
  state.walletId = w.id;
  localStorage.setItem('dc_walletId', w.id);
  updateWalletUI(w);
  document.getElementById('session-wallet').textContent = abbrev(w.id);
  return w;
}

async function refreshWallet() {
  try { await fetchMyWallet(); } catch (e) { showAlert('tx-alert', 'error', e.message); }
}

function updateWalletUI(w) {
  document.getElementById('wallet-balance').textContent  = `₦ ${fmt(w.balance)}`;
  document.getElementById('wallet-id-display').textContent = `wallet id: ${w.id}`;
  document.getElementById('wallet-currency').textContent = w.currency;
}

function copyWalletId() {
  if (!state.walletId) return;
  navigator.clipboard.writeText(state.walletId).catch(() => {});
  const btn = event.target;
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = 'Copy ID', 1500);
}

// ── Transfer ──────────────────────────────────────────────────────────────────
async function transfer() {
  clearAlert('tx-alert');
  const toWalletId     = document.getElementById('tx-to').value.trim();
  const amount         = document.getElementById('tx-amount').value.trim();
  const idempotencyKey = document.getElementById('tx-idem').value.trim();

  if (!toWalletId) return showAlert('tx-alert', 'error', 'Recipient wallet ID is required');
  if (!amount || parseFloat(amount) <= 0) return showAlert('tx-alert', 'error', 'Enter a valid amount');
  if (!state.walletId) return showAlert('tx-alert', 'error', 'Your wallet ID is not loaded yet');

  try {
    const j = await api(
      'POST',
      '/api/v1/transfers',
      { fromWalletId: state.walletId, toWalletId, amount },
      { 'Idempotency-Key': idempotencyKey },
    );
    showAlert('tx-alert', 'success', `Transfer ${j.data.id} — ${j.data.status}`);
    generateIdempotencyKey();
    await fetchMyWallet();
    await loadLedger();
  } catch (e) {
    showAlert('tx-alert', 'error', e.message);
  }
}

function generateIdempotencyKey() {
  document.getElementById('tx-idem').value = crypto.randomUUID();
}

// ── Wallet Lookup ─────────────────────────────────────────────────────────────
async function lookupWallet() {
  clearAlert('lookup-alert');
  document.getElementById('lookup-result').style.display = 'none';
  const id = document.getElementById('lookup-id').value.trim();
  if (!id) return showAlert('lookup-alert', 'error', 'Enter a wallet ID');
  try {
    const j = await api('GET', `/api/v1/wallets/${id}`);
    const w = j.data;
    document.getElementById('lookup-wid').textContent = w.id;
    document.getElementById('lookup-bal').textContent = `₦ ${fmt(w.balance)}`;
    document.getElementById('lookup-cur').textContent = w.currency;
    document.getElementById('lookup-result').style.display = 'block';
  } catch (e) {
    showAlert('lookup-alert', 'error', e.message);
  }
}

// ── Ledger ────────────────────────────────────────────────────────────────────
async function loadLedger() {
  if (!state.walletId) return;
  clearAlert('ledger-alert');
  const limit = document.getElementById('ledger-limit').value;
  try {
    const j = await api('GET', `/api/v1/ledger?walletId=${state.walletId}&limit=${limit}`);
    renderLedger(j.data);
  } catch (e) {
    showAlert('ledger-alert', 'error', e.message);
  }
}

function renderLedger(entries) {
  const tbody = document.getElementById('ledger-body');
  if (!entries || entries.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty">No transactions yet</td></tr>`;
    return;
  }
  tbody.innerHTML = entries.map(e => `
    <tr>
      <td><span class="badge badge-${e.type}">${e.type.toUpperCase()}</span></td>
      <td style="font-weight:600;color:${e.type==='credit'?'var(--green)':'var(--red)'}">
        ${e.type==='debit'?'-':'+'} ₦ ${fmt(e.amount)}
      </td>
      <td class="mono">${e.reference ? abbrev(e.reference, 16) : '—'}</td>
      <td class="mono">${e.transferId ? abbrev(e.transferId) : '—'}</td>
      <td class="text-muted">${fmtDate(e.createdAt)}</td>
    </tr>
  `).join('');
}

// ── Log ───────────────────────────────────────────────────────────────────────
function logReq(method, url, body) {
  const el = document.getElementById('log');
  if (el.querySelector('span')) el.innerHTML = '';
  const t  = new Date().toLocaleTimeString();
  const b  = body ? `\n  ${JSON.stringify(body, null, 2).replace(/\n/g, '\n  ')}` : '';
  el.innerHTML += `<div class="log-entry">
    <span class="log-time">${t}</span>
    <span class="log-req"> → ${method} ${url}${b}</span>
  </div>`;
  el.scrollTop = el.scrollHeight;
}

function logRes(status, json) {
  const el  = document.getElementById('log');
  const ok  = status >= 200 && status < 300;
  const cls = ok ? 'log-res' : 'log-err';
  const txt = JSON.stringify(json, null, 2).replace(/\n/g, '\n  ');
  el.innerHTML += `<div class="log-entry">
    <span class="${cls}"> ← ${status}\n  ${txt}</span>
  </div>`;
  el.scrollTop = el.scrollHeight;
}

function clearLog() {
  document.getElementById('log').innerHTML = '<span style="color:#555">Log cleared</span>';
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function showAlert(id, type, msg) {
  const el = document.getElementById(id);
  el.className = `alert alert-${type} show`;
  el.textContent = msg;
}
function clearAlert(id) {
  const el = document.getElementById(id);
  el.className = 'alert';
  el.textContent = '';
}
function fmt(n) {
  return parseFloat(n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function abbrev(s, n = 8) {
  if (!s) return '—';
  return s.length <= n * 2 + 3 ? s : `${s.slice(0, n)}…${s.slice(-4)}`;
}
function fmtDate(d) {
  return d ? new Date(d).toLocaleString() : '—';
}
</script>
