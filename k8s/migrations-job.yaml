apiVersion: batch/v1
kind: Job
metadata:
  name: demo-credit-migrations
  namespace: demo-credit
  labels:
    app.kubernetes.io/name: demo-credit
    app.kubernetes.io/component: migrations
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-credit
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: democreditdev6ho4npacr.azurecr.io/demo-credit-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - npm
            - run
            - migrate:latest
          envFrom:
            - configMapRef:
                name: demo-credit-config
            - secretRef:
                name: demo-credit-secrets
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: demo-credit-keyvault-secrets
